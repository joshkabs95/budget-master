global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: budget-master

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: django
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']
